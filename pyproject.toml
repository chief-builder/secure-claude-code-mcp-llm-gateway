[project]
name = "secure-claude-code-lab"
version = "0.1.0"
description = "Synthetic lab: Claude Code to AWS Bedrock through an OAuth and DPoP LLM gateway"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "PyJWT[crypto]==2.15.1",
    # Only the gateway's Bedrock backend uses the AWS SDK.
    "boto3==1.44.5",
    "botocore==1.44.6",
]

[dependency-groups]
dev = ["pytest==9.2.0"]

[tool.uv]
# The components are run from their own directories, not installed as a package.
package = false
