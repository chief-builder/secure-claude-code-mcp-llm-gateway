[project]
name = "secure-claude-code-lab"
version = "0.1.0"
description = "Synthetic lab: Claude Code to AWS Bedrock through an OAuth and DPoP LLM gateway"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "PyJWT[crypto]==2.15.1",
    # Only the gateway's Bedrock backend uses the AWS SDK.
    "boto3==1.44.5",
    "botocore==1.44.6",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# The components are plain modules run from their own directories. `uv sync` installs
# this project in editable mode, which puts these directories on the import path, so
# one component can import another without changing sys.path at run time.
# mock-llm is not listed: it is a separate package called `app`, started with
# uvicorn's --app-dir, and nothing imports it.
dev-mode-dirs = [
    "components/oauth-lab",
    "components/oauth-as",
    "components/gateway",
    "components/broker",
]

[tool.hatch.build.targets.wheel]
# Nothing is built for distribution; the editable install exists only for the paths.
bypass-selection = true

[tool.ruff.lint]
# A deliberately small set: syntax errors, undefined names, unused imports and
# variables, and import placement. No formatter and no import sorting.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Existing findings that are not defects. Each goes away in the package-shared-code
# task (workflow/ROADMAP.md), which must delete its line here.
#
# Imports that follow a sys.path.insert line, which is how components currently
# reach each other's modules.
"components/gateway/manual_claude_check.py" = ["E402"]
# pytest fixtures imported from another test module: the import looks unused and the
# test's parameter looks like a redefinition.
"components/gateway/tests/test_bedrock.py" = ["F401", "F811"]
"components/oauth-as/tests/test_exchange.py" = ["F401", "F811"]
